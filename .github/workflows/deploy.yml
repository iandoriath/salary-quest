name: Deploy to GitHub Pages

# Publishes the site by syncing main into the gh-pages branch, which GitHub
# Pages serves. This route works with the default GITHUB_TOKEN; the
# actions/deploy-pages route requires admin rights to enable the Pages site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:gh-pages
